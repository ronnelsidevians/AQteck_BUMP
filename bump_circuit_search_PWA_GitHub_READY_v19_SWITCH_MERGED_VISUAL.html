classList.remove('dragging')});modalImgBox.addEventListener('touchstart',e=>{if(e.touches.length===1){imgDragging=true;imgLastX=e.touches[0].clientX;imgLastY=e.touches[0].clientY}else if(e.touches.length===2){imgDragging=false;pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pinchScale=imgScale}},{passive:false});modalImgBox.addEventListener('touchmove',e=>{if(!modal.classList.contains('open'))return;e.preventDefault();if(e.touches.length===1&&imgDragging){imgX+=e.touches[0].clientX-imgLastX;imgY+=e.touches[0].clientY-imgLastY;imgLastX=e.touches[0].clientX;imgLastY=e.touches[0].clientY;applyImgTransform()}else if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);imgScale=Math.min(8,Math.max(1,pinchScale*d/Math.max(1,pinchDist)));applyImgTransform()}},{passive:false});modalImgBox.addEventListener('touchend',()=>{imgDragging=false})}init()})();
